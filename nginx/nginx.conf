events {}

http {
    upstream springboot {
        server chatgraph-be:8080;
    }

    # 1) 80포트로 들어오면 https로 리다이렉트
    server {
        listen 80;
        server_name api.chatgraph.site;

        location /.well-known/acme-challenge/ {
                root /var/www/certbot;
        }

        location / {
                return 301 https://$host$request_uri;
        }
}

    # 2) 443포트(SSL)로 프록시
    server {
        listen 443 ssl;
        server_name api.chatgraph.site;

        # 1. 숨김 파일 및 환경 설정 파일 접근 차단 (.env, .git, .sh 등)
        location ~ /\.(env|git|htaccess|ssh|config) {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # 2. 취약점 공격에 자주 사용되는 경로 차단 (PHPUnit, setup 등)
        location ~* /(vendor|phpunit|setup\.php|phpinfo\.php|actuator) {
            deny all;
            access_log off;
        }
        
        # 3. 비정상적인 HTTP 메서드 및 프록시 시도 차단
        if ($request_method !~ ^(GET|POST|PUT|DELETE|PATCH|OPTIONS)$ ) {
            return 405;
        }
    }

        # Let's Encrypt 인증서 경로
        ssl_certificate /etc/letsencrypt/live/api.chatgraph.site/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.chatgraph.site/privkey.pem;

        # ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
        # ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            # 백엔드 프록시
            proxy_pass         http://springboot;
            proxy_http_version 1.1;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
        }
    }
}
